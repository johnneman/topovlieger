server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location /data/ { add_header Cache-Control "public, max-age=86400"; }
    # Eigen geluidjes: de app haalt de lijst op als JSON.
    location /sounds/ {
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }
    location / { try_files $uri $uri/ /index.html; }
}
